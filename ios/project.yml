name: Finny
options:
  bundleIdPrefix: com.pranav
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "8"
targets:
  Finny:
    type: application
    platform: iOS
    sources: [Finny, Shared]
    dependencies:
      - target: FinnyWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pranav.finny
        INFOPLIST_FILE: Finny/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Finny/Resources/Finny.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 9U72AVU3KH
  FinnyWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: FinnyWidgets
        excludes: ["*.entitlements"]
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pranav.finny.widgets
        INFOPLIST_FILE: FinnyWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: FinnyWidgets/FinnyWidgets.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 9U72AVU3KH
